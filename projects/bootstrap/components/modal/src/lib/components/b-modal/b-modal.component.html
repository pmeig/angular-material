@if (display.container()) {
  <div [id]="name()" [class]="'modal ' + settings.animations.type() + ' ' + classes()" (click)="closeByClick(modalTemplate, $event)"
       [ngClass]="{show: display.show(), 'd-block': display.container(), 'no-backdrop': !display.backdrop(),
        'modal-static': settings.animations.static()}">
    <div [class]="'modal-dialog ' + settings.size.value()" [ngClass]="{'modal-dialog-centered': settings.center(),
      'modal-dialog-scrollable': settings.scrollable()}">
      <div class="modal-content" #modalTemplate>
        @if (display.content.header.active()) {
          <div class="modal-header" #header>
            <div class="modal-content-header">
              <ng-content select="[header]"></ng-content>
              <ng-container [ngTemplateOutlet]="container" [ngTemplateOutletContext]="{templates: headers}"></ng-container>
              @if (title(); as modalTitle) {
                <div class="modal-title">{{ modalTitle }}</div>
              }
            </div>
            <btn-group>
              <ng-content select="[btn]"></ng-content>
              <ng-container [ngTemplateOutlet]="container" [ngTemplateOutletContext]="{templates: buttons}"></ng-container>
              @if (display.content.header.cross()) {
                <button close [id]="name() + '-close'" (click)="close()"></button>
              }
            </btn-group>
          </div>
        }
        <div class="modal-body" *hasChildren>
          <ng-content></ng-content>
          <ng-container [ngTemplateOutlet]="container" [ngTemplateOutletContext]="{templates: bodies}"></ng-container>
        </div>
        <div class="modal-footer" *hasChildren>
          <ng-content select="[footer]"></ng-content>
          <ng-container [ngTemplateOutlet]="container" [ngTemplateOutletContext]="{templates: footers}"></ng-container>
        </div>
      </div>
    </div>
  </div>
  @if (display.backdrop()) {
    <div class="modal-backdrop fade" [ngClass]="{show: display.show(), 'd-block': display.container()}">
    </div>
  }
}

<ng-template let-templates="templates" #container>
  @if (templates.length) {
    @for (item of templates; track $index) {
      <ng-container [ngTemplateOutlet]="item" [ngTemplateOutletContext]="{close: closeBind}"></ng-container>
    }
  }
</ng-template>
